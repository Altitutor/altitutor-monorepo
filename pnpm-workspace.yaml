packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 reads dependency-layout settings here, rather than .npmrc.
engineStrict: true
autoInstallPeers: true
strictPeerDependencies: false
hoist: true
hoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '*typescript*'
symlink: true
sideEffectsCache: true
sideEffectsCacheReadonly: false
lockfile: true
nodeLinker: hoisted

# Native apps inject shared so its React peer resolves to their React 19.
syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  '@sentry/cli': true
  '@swc/core': true
  cbor-extract: true
  core-js: false
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  supabase: true
  tesseract.js: true
  unrs-resolver: true

overrides:
  # DEV-288: the Babel parent retains an older nested copy; 4.29.5 satisfies its ^4.24.0 range.
  "@babel/helper-compilation-targets@7.29.7>browserslist": "4.29.5"
  "proxy-addr": "^2.0.8"
  "shell-quote": "^1.12.0"
  "dompurify": "^3.4.17"
  "qs": "^6.14.2"
  "lodash": "^4.18.1"
  "lodash-es": "^4.18.1"
  "markdown-it": "^14.1.1"
  "tar": "^7.5.8"
  "glob": "^10.5.0"
  "rollup": "^4.59.0"
  "webpack": "^5.104.1"
  "serialize-javascript": "^7.0.3"
  "minimatch@^3.0.0": "3.1.5"
  "minimatch@^9.0.0": "9.0.9"
  "js-yaml@^3.0.0": "3.15.2"
  "js-yaml@^4.0.0": "4.3.2"
  "bn.js@^4.0.0": "4.12.3"
  "bn.js@^5.0.0": "5.2.3"
  "ajv@^6.0.0": "6.14.0"
  "ajv@^8.0.0": "8.18.0"
  "@tiptap/core": "3.32.2"
  "@tiptap/pm": "3.32.2"

patchedDependencies:
  "react-big-calendar@1.19.4": "patches/react-big-calendar@1.19.4.patch"

peerDependencyRules:
  allowedVersions:
    tailwindcss: "3.4.18"
    typescript: ">=4.8.4 <7.0.0"

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.26'
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - expo@57.0.24
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.19'
  - expo-notifications@57.0.20
  - expo-router@57.0.22
  - lucide-react@1.65.0
  # DEV-280: exact coordinated editor targets; retain the global release-age policy.
  - '@tiptap/core@3.32.2'
  - '@tiptap/extension-blockquote@3.32.2'
  - '@tiptap/extension-bold@3.32.2'
  - '@tiptap/extension-bubble-menu@3.32.2'
  - '@tiptap/extension-bullet-list@3.32.2'
  - '@tiptap/extension-code-block@3.32.2'
  - '@tiptap/extension-code@3.32.2'
  - '@tiptap/extension-details@3.32.2'
  - '@tiptap/extension-document@3.32.2'
  - '@tiptap/extension-dropcursor@3.32.2'
  - '@tiptap/extension-floating-menu@3.32.2'
  - '@tiptap/extension-gapcursor@3.32.2'
  - '@tiptap/extension-hard-break@3.32.2'
  - '@tiptap/extension-heading@3.32.2'
  - '@tiptap/extension-horizontal-rule@3.32.2'
  - '@tiptap/extension-image@3.32.2'
  - '@tiptap/extension-italic@3.32.2'
  - '@tiptap/extension-link@3.32.2'
  - '@tiptap/extension-list-item@3.32.2'
  - '@tiptap/extension-list-keymap@3.32.2'
  - '@tiptap/extension-list@3.32.2'
  - '@tiptap/extension-mathematics@3.32.2'
  - '@tiptap/extension-mention@3.32.2'
  - '@tiptap/extension-ordered-list@3.32.2'
  - '@tiptap/extension-paragraph@3.32.2'
  - '@tiptap/extension-placeholder@3.32.2'
  - '@tiptap/extension-strike@3.32.2'
  - '@tiptap/extension-table@3.32.2'
  - '@tiptap/extension-text-style@3.32.2'
  - '@tiptap/extension-text@3.32.2'
  - '@tiptap/extension-typography@3.32.2'
  - '@tiptap/extension-underline@3.32.2'
  - '@tiptap/extensions@3.32.2'
  - '@tiptap/markdown@3.32.2'
  - '@tiptap/pm@3.32.2'
  - '@tiptap/react@3.32.2'
  - '@tiptap/starter-kit@3.32.2'
  - '@tiptap/suggestion@3.32.2'
