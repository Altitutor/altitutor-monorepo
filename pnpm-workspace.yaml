packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  supabase: true
  tesseract.js: true
  unrs-resolver: true

overrides:
  "qs": "^6.14.2"
  "lodash": "^4.17.23"
  "lodash-es": "^4.17.23"
  "markdown-it": "^14.1.1"
  "tar": "^7.5.8"
  "glob": "^10.5.0"
  "rollup": "^4.59.0"
  "webpack": "^5.104.1"
  "serialize-javascript": "^7.0.3"
  "minimatch@^3.0.0": "3.1.4"
  "minimatch@^9.0.0": "9.0.7"
  "js-yaml@^3.0.0": "3.14.2"
  "js-yaml@^4.0.0": "4.1.1"
  "bn.js@^4.0.0": "4.12.3"
  "bn.js@^5.0.0": "5.2.3"
  "ajv@^6.0.0": "6.14.0"
  "ajv@^8.0.0": "8.18.0"
  "@tiptap/core": "3.22.5"
  "@tiptap/pm": "3.22.5"

patchedDependencies:
  "react-big-calendar@1.19.4": "patches/react-big-calendar@1.19.4.patch"

packageExtensions:
  "@storybook/addon-docs@8.6.17":
    peerDependencies:
      react: "^18.3.1"
      react-dom: "^18.3.1"

peerDependencyRules:
  allowedVersions:
    tailwindcss: "3.4.18"
    typescript: ">=4.8.4 <7.0.0"
