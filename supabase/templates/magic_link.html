<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Confirm your Alti UCAT account</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #1a1a1a">
      <tr>
        <td align="center" style="padding: 48px 20px">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="560" style="max-width: 560px">
            <tr>
              <td style="padding: 40px 48px 36px; background-color: #0a2941; border-radius: 24px 24px 0 0; text-align: center">
                <p style="margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: #92b9c6">Alti UCAT Prep</p>
                <h1 style="margin: 0; font-size: 28px; font-weight: 700; color: #f2f0e9; line-height: 1.2">Confirm your email</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 40px 48px 36px; background-color: #111827">
                <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.7; color: #9ca3af">Enter the 6-digit code below on the page where you requested it.</p>

                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: 28px 0; background-color: #0f172a; border-radius: 12px">
                  <tr>
                    <td style="padding: 20px 24px; text-align: center">
                      <p style="margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #92b9c6">Your sign-in code</p>
                      <p style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: 0.35em; color: #f2f0e9; font-family: ui-monospace, Menlo, Monaco, Consolas, monospace">{{ .Token }}</p>
                    </td>
                  </tr>
                </table>

                <p style="margin: 0; font-size: 13px; color: #6b7280">
                  This code expires in
                  <strong style="color: #9ca3af">1 hour</strong>. If you didn&apos;t request this, ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 48px; background-color: #0d1117; border-radius: 0 0 24px 24px; text-align: center">
                <p style="margin: 0; font-size: 12px; color: #4b5563">Alti UCAT Prep · Altitutor</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
