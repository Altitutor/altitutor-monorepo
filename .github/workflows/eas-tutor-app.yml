name: Tutor app EAS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [ios, android, all]
        default: all
      submit:
        description: Submit the production build to TestFlight or Google Play
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eas-tutor-app-${{ github.ref }}-${{ inputs.profile }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS ${{ inputs.profile }} ${{ inputs.platform }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.profile == 'production' && 'production' || 'development' }}
    env:
      EXPO_PUBLIC_TUTOR_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_TUTOR_EAS_PROJECT_ID }}
      EAS_PROFILE: ${{ inputs.profile }}
      EAS_PLATFORM: ${{ inputs.platform }}
      EAS_SUBMIT: ${{ inputs.submit }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate the build request
        working-directory: apps/tutor-app
        run: |
          if [ "$EAS_PROFILE" = production ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Tutor production builds must run from main." >&2
            exit 1
          fi
          if [ "$EAS_SUBMIT" = true ] && [ "$EAS_PROFILE" != production ]; then
            echo "Store submission requires the production profile." >&2
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_TUTOR_EAS_PROJECT_ID" ]; then
            echo "Set EXPO_PUBLIC_TUTOR_EAS_PROJECT_ID to the Tutor project ID in GitHub Actions variables." >&2
            exit 1
          fi
          if [ "$EAS_SUBMIT" = true ] && [ "$EAS_PLATFORM" != android ]; then
            if ! jq -e '.submit.production.ios.ascAppId | strings | test("^[0-9]+$")' eas.json >/dev/null; then
              echo "Set submit.production.ios.ascAppId in apps/tutor-app/eas.json before submitting to TestFlight." >&2
              exit 1
            fi
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Queue build on EAS
        working-directory: apps/tutor-app
        run: |
          extra=()
          if [ "$EAS_SUBMIT" = true ]; then
            extra+=(--auto-submit)
          fi
          eas build --platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive --no-wait "${extra[@]}"
