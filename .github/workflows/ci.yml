# Monorepo CI for all workspace apps (admin-web, tutor-web, student-web, marketing-web, ucat-web, student-app, ucat-app, packages).
# PRs and development run affected packages. Production releases run the full monorepo.
name: CI

on:
  workflow_call:
    inputs:
      full_run:
        description: Run every workspace task instead of only packages affected by the current commit
        required: false
        type: boolean
        default: true
  # Required checks must report for every PR, including documentation-only work.
  # Browser/database jobs retain their existing path-based selection below.
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DISABLED: 'true'
  NEXT_PUBLIC_SENTRY_DISABLED: 'true'
  EXPO_PUBLIC_SENTRY_DISABLED: 'true'
  SENTRY_TEST_OPT_IN: 'false'
  NEXT_PUBLIC_SENTRY_TEST_OPT_IN: 'false'
  EXPO_PUBLIC_SENTRY_TEST_OPT_IN: 'false'
  SENTRY_DSN: ''
  NEXT_PUBLIC_SENTRY_DSN: ''
  EXPO_PUBLIC_SENTRY_DSN: ''

jobs:
  validation-plan:
    name: Detect web system tests
    runs-on: ubuntu-latest
    outputs:
      turbo_filter: ${{ steps.plan.outputs.turbo_filter }}
      apps: ${{ steps.plan.outputs.apps }}
      run: ${{ steps.plan.outputs.run }}
      database: ${{ steps.plan.outputs.database }}
      ucat_coverage: ${{ steps.plan.outputs.ucat_coverage }}
      edge: ${{ steps.plan.outputs.edge }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Select checks from the complete event range
        id: plan
        env:
          INPUT_FULL_RUN: ${{ inputs.full_run == true && 'true' || 'false' }}
        run: |
          node scripts/validation-plan.mjs > validation-plan.json
          node scripts/validation-plan.mjs --github-output >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-plan
          path: validation-plan.json
          if-no-files-found: error
          retention-days: 14

  lint:
    needs: validation-plan
    env:
      TURBO_FILTER: ${{ needs.validation-plan.outputs.turbo_filter }}
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production release gate
        run: |
          node --test scripts/teaching-release.test.mjs scripts/production-release-gate.test.mjs scripts/production-web-smoke.test.mjs scripts/start-local-supabase.test.mjs scripts/ucat-production-smoke.test.mjs scripts/ucat-system-test-paths.test.mjs scripts/web-system-test-paths.test.mjs scripts/release-pr-links.test.mjs scripts/browser-ci-workflow.test.mjs scripts/web-ci-result.test.mjs scripts/validation-plan.test.mjs scripts/validation-receipt.test.mjs scripts/verified-integration.test.mjs scripts/auxiliary-queue-contracts.test.mjs scripts/validation-preflight.test.mjs scripts/verify-ucat-test-inventory.test.mjs scripts/checkall-profiles.test.mjs secrets/scripts/deploy-runtime.test.mjs
          python3 scripts/owned_database.test.py
          python3 scripts/worktree_dev.test.py

      - name: Require a new native runtime for native changes
        run: node scripts/check-expo-runtime-version.mjs "${{ needs.validation-plan.outputs.base || 'HEAD^' }}"

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - name: Check generated email artifacts
        run: pnpm email:check

      - name: List affected packages
        if: env.TURBO_FILTER != ''
        run: pnpm lint --filter="${{ env.TURBO_FILTER }}" --dry-run

      - name: Run linter
        run: |
          set -euo pipefail
          if [ -n "${{ env.TURBO_FILTER }}" ]; then
            pnpm lint --filter="${{ env.TURBO_FILTER }}"
          else
            pnpm lint
          fi

      - name: Check formatting
        continue-on-error: true
        run: |
          if command -v prettier >/dev/null 2>&1; then
            pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}" --ignore-path .gitignore || {
              echo "::warning::Code formatting issues found. Run 'pnpm format' to fix."
            }
          fi

  typecheck:
    needs: validation-plan
    env:
      TURBO_FILTER: ${{ needs.validation-plan.outputs.turbo_filter }}
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          if [ -n "${{ env.TURBO_FILTER }}" ]; then
            pnpm exec turbo run typecheck --concurrency=1 --filter="${{ env.TURBO_FILTER }}"
          else
            pnpm exec turbo run typecheck --concurrency=1
          fi

  test:
    needs: validation-plan
    env:
      TURBO_FILTER: ${{ needs.validation-plan.outputs.turbo_filter }}
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          set -euo pipefail
          if [ -n "${{ env.TURBO_FILTER }}" ]; then
            pnpm turbo run test --concurrency=2 --filter='!ucat-web' --filter="${{ env.TURBO_FILTER }}"
          else
            pnpm turbo run test --concurrency=2 --filter='!ucat-web'
          fi

  ucat-contracts:
    needs: validation-plan
    name: UCAT Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Validate contract selection
        env:
          COVERAGE: ${{ needs.validation-plan.outputs.ucat_coverage }}
          EDGE: ${{ needs.validation-plan.outputs.edge }}
        run: |
          case "$COVERAGE:$EDGE" in
            true:true|true:false|false:true|false:false) ;;
            *) echo 'Invalid contract selection' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        if: needs.validation-plan.outputs.ucat_coverage == 'true' || needs.validation-plan.outputs.edge == 'true'

      - uses: pnpm/action-setup@v4
        if: needs.validation-plan.outputs.ucat_coverage == 'true' || needs.validation-plan.outputs.edge == 'true'

      - uses: actions/setup-node@v4
        if: needs.validation-plan.outputs.ucat_coverage == 'true' || needs.validation-plan.outputs.edge == 'true'
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - uses: denoland/setup-deno@v2
        if: needs.validation-plan.outputs.edge == 'true'
        with:
          deno-version: v2.9.6

      - name: Install dependencies
        if: needs.validation-plan.outputs.ucat_coverage == 'true' || needs.validation-plan.outputs.edge == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify coverage retains the unit test inventory
        if: needs.validation-plan.outputs.ucat_coverage == 'true'
        run: node scripts/verify-ucat-test-inventory.mjs

      - name: Enforce UCAT application coverage
        if: needs.validation-plan.outputs.ucat_coverage == 'true'
        run: pnpm --filter ucat-web test:coverage

      - name: Test Supabase Edge Function contracts
        if: needs.validation-plan.outputs.edge == 'true'
        run: deno test --config supabase/functions/deno.json --allow-env supabase/functions

  web-browser:
    name: Browser (${{ matrix.app }})
    needs: validation-plan
    if: needs.validation-plan.outputs.apps != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: ${{ fromJSON(needs.validation-plan.outputs.apps || '[]') }}
    uses: ./.github/workflows/web-system-suite.yml
    with:
      suite: ${{ matrix.app }}
      registration: ${{ matrix.app == 'student' && needs.validation-plan.outputs.database != 'true' }}
      production: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' || inputs.full_run == true }}

  database-contracts:
    name: Database contracts
    needs: validation-plan
    if: needs.validation-plan.outputs.database == 'true'
    uses: ./.github/workflows/web-system-suite.yml
    with:
      suite: database
      production: false

  web-e2e:
    name: Web Browser and Database
    needs: [validation-plan, lint, typecheck, test, ucat-contracts, build, web-browser, database-contracts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require every core and selected suite to succeed
        env:
          WEB_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/web-ci-result.mjs
      # Publish evidence before this required check can release the merge group.
      - uses: pnpm/action-setup@v4
        if: github.event_name == 'merge_group'
      - uses: denoland/setup-deno@v2
        if: github.event_name == 'merge_group'
        with:
          deno-version: v2.9.6
      - uses: supabase/setup-cli@v2
        if: github.event_name == 'merge_group'
        with:
          version: 2.107.0
      - name: Bind successful validation to its integration tree
        if: github.event_name == 'merge_group'
        env:
          WEB_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          CI_REQUIRED_RESULTS="$(node scripts/web-ci-result.mjs --receipt-results)"
          export CI_REQUIRED_RESULTS
          node scripts/validation-plan.mjs > validation-plan.json
          node scripts/verified-integration.mjs create --plan validation-plan.json --output integration-receipt.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'merge_group'
        with:
          name: ci-integration-receipt
          path: integration-receipt.json
          if-no-files-found: error
          retention-days: 14

  build:
    needs: validation-plan
    env:
      TURBO_FILTER: ${{ needs.validation-plan.outputs.turbo_filter }}
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and apps
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Lint and type checking run in dedicated required CI jobs.
          ALTITUTOR_CI_BUILD: "true"
        run: |
          set -euo pipefail
          if [ -n "${{ env.TURBO_FILTER }}" ]; then
            pnpm build --concurrency=1 --filter="${{ env.TURBO_FILTER }}"
          else
            pnpm build --concurrency=1
          fi
