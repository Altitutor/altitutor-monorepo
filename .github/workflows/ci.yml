# Monorepo CI for all workspace apps (admin-web, tutor-web, student-web, marketing-web, ucat-web, student-app, packages).
# PRs and development run affected packages. Production releases run the full monorepo.
name: CI

on:
  workflow_call:
    inputs:
      full_run:
        description: Run every workspace task instead of only packages affected by the current commit
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/scripts/**'
      - 'supabase/templates/**'
      - 'scripts/**'
      - 'turbo.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # PRs compare with their base branch; development calls compare with the prior commit.
  # An empty filter is reserved for full production verification and manual runs.
  TURBO_FILTER: ${{ github.event_name == 'pull_request' && format('...[origin/{0}]', github.base_ref) || (github.event_name == 'push' && inputs.full_run == false && '...[HEAD^]' || '') }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for Turborepo affected
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --no-tags

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Check production release gate
        run: node --test scripts/production-release-gate.test.mjs

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated email artifacts
        run: pnpm email:check

      - name: List affected packages
        if: env.TURBO_FILTER != ''
        run: pnpm turbo run lint --filter="${{ env.TURBO_FILTER }}" --dry-run

      - name: Run linter
        run: |
          set -euo pipefail
          if [ -n "${{ env.TURBO_FILTER }}" ]; then
            pnpm turbo run lint --filter="${{ env.TURBO_FILTER }}"
          else
            pnpm turbo run lint
          fi

      - name: Check formatting
        continue-on-error: true
        run: |
          if command -v prettier >/dev/null 2>&1; then
            pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}" --ignore-path .gitignore || {
              echo "::warning::Code formatting issues found. Run 'pnpm format' to fix."
            }
          fi

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for Turborepo affected
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --no-tags

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: |
          set -euo pipefail
          if [ -n "${{ env.TURBO_FILTER }}" ]; then
            pnpm turbo run typecheck --filter="${{ env.TURBO_FILTER }}"
          else
            pnpm turbo run typecheck
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for Turborepo affected
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --no-tags

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          set -euo pipefail
          if [ -n "${{ env.TURBO_FILTER }}" ]; then
            pnpm turbo run test --filter="${{ env.TURBO_FILTER }}"
          else
            pnpm turbo run test
          fi

  ucat-contracts:
    name: UCAT Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce UCAT application coverage
        run: pnpm --filter ucat-web test:coverage

      - name: Test Supabase Edge Function contracts
        run: deno test --config supabase/functions/deno.json --allow-env supabase/functions

  ucat-e2e:
    name: UCAT Browser and Database
    runs-on: ubuntu-latest
    # Supabase startup and the production browser matrix share this job. The
    # timeout is a safety ceiling, not an expected duration; keep enough room
    # for browser retries and diagnostic upload on slower hosted runners.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - uses: supabase/setup-cli@v2
        with:
          version: 2.107.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install critical browser
        if: github.ref_name != 'main' && github.event_name != 'workflow_dispatch'
        run: pnpm --filter ucat-web exec playwright install --with-deps chromium

      - name: Install production browser matrix
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        run: pnpm --filter ucat-web exec playwright install --with-deps chromium firefox webkit chrome msedge

      - name: Render email templates
        run: bash supabase/scripts/render-email-templates.sh

      - name: Start and seed local Supabase
        run: |
          supabase start
          supabase db reset

      - name: Test database contracts
        run: supabase test db

      - name: Run critical browser journeys
        if: github.ref_name != 'main' && github.event_name != 'workflow_dispatch'
        run: pnpm --filter ucat-web test:e2e:critical

      - name: Run production browser matrix
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        env:
          UCAT_E2E_FULL_BROWSER_MATRIX: "true"
        run: pnpm --filter ucat-web test:e2e

      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucat-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/ucat-web/playwright-report
            apps/ucat-web/test-results
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for Turborepo affected
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --no-tags

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and apps
        run: |
          set -euo pipefail
          if [ -n "${{ env.TURBO_FILTER }}" ]; then
            pnpm turbo run build --filter="${{ env.TURBO_FILTER }}"
          else
            pnpm turbo run build
          fi
