name: Release PR issue links

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:

# No other workflow or repository permission is changed.
permissions:
  contents: read
  pull-requests: write

# All triggers share one writer. Queued events always read the current refs.
concurrency:
  group: release-pr-issue-links
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'Altitutor/altitutor-monorepo' &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always execute the trusted main implementation. Never checkout the
      # release head, fork code, or a manually selected dispatch branch.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: scripts/release-pr-links.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const moduleUrl = pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/release-pr-links.mjs'));
            const { runReleaseLinkAction } = await import(moduleUrl.href);
            const results = await runReleaseLinkAction(github, context);
            await core.summary.addHeading('Release issue link refresh')
              .addRaw(results.map(({ number, status }) => `PR #${number}: ${status}`).join('\n') || 'No open develop → main release PR.')
              .write();
