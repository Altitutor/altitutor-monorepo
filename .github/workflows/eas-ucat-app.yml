# Manual EAS builds for the UCAT native app. Store submit is opt-in and
# production-profile only — native reviews must not fire on every main push.
name: UCAT app EAS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options:
          - preview
          - production
        default: preview
      platform:
        description: Platform
        type: choice
        options:
          - ios
          - android
          - all
        default: all
      submit:
        description: Submit the production build to App Store / Play Store
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eas-ucat-app-${{ github.ref }}-${{ inputs.profile }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS ${{ inputs.profile }} ${{ inputs.platform }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.profile == 'production' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Require a registered EAS project
        working-directory: apps/ucat-app
        run: |
          python3 - <<'PY'
          import json
          import sys

          config = json.load(open("app.json"))
          project_id = (
              config.get("expo", {}).get("extra", {}).get("eas", {}).get("projectId")
          )
          if not project_id:
              print(
                  "Register the EAS project first: cd apps/ucat-app && eas init",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Reject store submit for non-production profiles
        if: ${{ inputs.submit && inputs.profile != 'production' }}
        run: |
          echo "Store submit is only allowed for the production profile." >&2
          exit 1

      - name: Build on EAS
        working-directory: apps/ucat-app
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ucat-app
        run: |
          extra=()
          if [ "${{ inputs.submit }}" = "true" ]; then
            extra+=(--auto-submit)
          fi
          eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait "${extra[@]}"
