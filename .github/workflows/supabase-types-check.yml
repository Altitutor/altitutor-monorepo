name: Supabase Types Check

# Validates generated.ts against repo migrations before merge.
# Deploy does not re-check types; remote schema should match migrations after db push.
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/validation-plan.mjs'
      - 'scripts/web-system-test-paths.mjs'
      - '.github/workflows/supabase-types-check.yml'
      - 'packages/shared/src/supabase/generated.ts'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: supabase-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select schema type validation
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.selection.outputs.supabase_types }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Select checks from the complete event range
        id: selection
        run: node scripts/validation-plan.mjs --github-output >> "$GITHUB_OUTPUT"

  validate:
    name: Regenerate and compare Supabase types
    needs: [plan]
    if: ${{ needs.plan.outputs.selected == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          # Keep Supabase CI on the same version used by deploy; v2.108.0 currently
          # fails config push while reading Storage config on some projects.
          version: 2.107.0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies (for pnpm db:types / shared build)
        run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development

      - name: Confirm Supabase CLI version
        run: supabase --version

      - name: Check generated Auth email templates
        run: pnpm email:check

      - name: Render email templates
        run: bash supabase/scripts/render-email-templates.sh

      - name: Start Supabase and apply migrations
        run: |
          set -euo pipefail
          # Types only need schema. Skip automatic seed so this job does not
          # apply local accounts or UCAT fixtures.
          python3 supabase/scripts/disable-automatic-seed.py
          supabase start --exclude studio,imgproxy,logflare,vector,postgres-meta,mailpit

      - name: Cache postgres-meta image from GHCR
        run: |
          # Supabase CLI 2.108.0 type generation still requests this image from
          # ECR, whose shared GitHub runner limit can block an otherwise valid check.
          docker pull ghcr.io/supabase/postgres-meta:v0.96.1
          docker tag ghcr.io/supabase/postgres-meta:v0.96.1 public.ecr.aws/supabase/postgres-meta:v0.96.1

      - name: Regenerate types and fail if committed file is stale
        run: |
          cp packages/shared/src/supabase/generated.ts /tmp/generated.ts.before
          pnpm db:types
          if ! diff -q /tmp/generated.ts.before packages/shared/src/supabase/generated.ts; then
            echo "::error::packages/shared/src/supabase/generated.ts is out of date."
            echo "Run 'pnpm db:committypes' and commit the result with your migration."
            diff -u /tmp/generated.ts.before packages/shared/src/supabase/generated.ts | head -80 || true
            exit 1
          fi
          echo "Committed types match local schema from migrations"

  verify-types:
    name: Verify generated.ts matches schema
    if: ${{ always() }}
    needs: [plan, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Report auxiliary validation result
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED: ${{ needs.plan.outputs.selected }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          echo "Selection: $SELECTED; plan: $PLAN_RESULT; validation: $VALIDATION_RESULT"
          test "$PLAN_RESULT" = success || exit 1
          case "$SELECTED:$VALIDATION_RESULT" in
            true:success|false:skipped) exit 0 ;;
            *) echo "::error::Auxiliary validation did not satisfy its plan"; exit 1 ;;
          esac
