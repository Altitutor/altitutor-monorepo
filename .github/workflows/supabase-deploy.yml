name: Supabase Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    uses: ./.github/workflows/ci.yml
    with:
      full_run: ${{ github.ref_name == 'main' }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      UCAT_EMAIL_DISPATCH_SECRET_KEY: ${{ secrets.UCAT_EMAIL_DISPATCH_SECRET_KEY }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
      # deploy-config.sh uses this to pick default portal URLs and localhost auth redirects
      SUPABASE_CONFIG_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          # v2.108.0 fails config push on some projects while reading Storage config:
          # SchemaError(Missing key at ["databasePoolMode"])
          version: 2.107.0

      - name: Confirm Supabase CLI version
        run: supabase --version

      - name: Test migration connection settings
        run: node --test supabase/scripts/migration-database-url.test.mjs

      - name: Render email templates
        run: bash supabase/scripts/render-email-templates.sh

      - name: Export CLI env (PROJECT_ID, DB_PASSWORD)
        run: |
          echo "SUPABASE_PROJECT_ID=${{ secrets.SUPABASE_PROJECT_ID }}" >> $GITHUB_ENV
          echo "SUPABASE_DB_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }}" >> $GITHUB_ENV

      - name: Link project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      - name: Require production transactional email authentication
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$UCAT_EMAIL_DISPATCH_SECRET_KEY" ]; then
            echo "UCAT_EMAIL_DISPATCH_SECRET_KEY is required in the production GitHub Environment." >&2
            exit 1
          fi

      - name: Require production PostHog capture configuration
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$POSTHOG_PROJECT_TOKEN" ]; then
            echo "POSTHOG_PROJECT_TOKEN is required in the production GitHub Environment." >&2
            exit 1
          fi
          if [ -z "$POSTHOG_HOST" ]; then
            echo "POSTHOG_HOST is required in the production GitHub Environment." >&2
            exit 1
          fi

      - name: Push migrations
        timeout-minutes: 35
        # --include-all applies local migrations inserted before the remote's
        # latest version (e.g. 20260609110927 after prod already ran 2026060913*).
        run: |
          bash supabase/scripts/render-email-templates.sh
          # Hosted projects cap the default statement timeout at two minutes.
          # Use the linked session-pooler URL so large, bounded migrations can
          # override that default without changing database-wide settings.
          migration_db_url="$(node supabase/scripts/migration-database-url.mjs supabase/.temp/pooler-url)"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" supabase db push --db-url "$migration_db_url" --include-all

      - name: Synchronize transactional email authentication
        if: env.UCAT_EMAIL_DISPATCH_SECRET_KEY != ''
        run: |
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_ID" \
            UCAT_EMAIL_DISPATCH_SECRET_KEY="$UCAT_EMAIL_DISPATCH_SECRET_KEY"
          migration_db_url="$(node supabase/scripts/migration-database-url.mjs supabase/.temp/pooler-url)"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "$migration_db_url" \
            --set=dispatch_secret="$UCAT_EMAIL_DISPATCH_SECRET_KEY" \
            --file=supabase/scripts/sync-ucat-email-dispatch-secret.sql

      - name: Synchronize PostHog capture configuration
        if: env.POSTHOG_PROJECT_TOKEN != '' && env.POSTHOG_HOST != ''
        run: |
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_ID" \
            POSTHOG_PROJECT_TOKEN="$POSTHOG_PROJECT_TOKEN" \
            POSTHOG_HOST="$POSTHOG_HOST"

      - name: Lint remote schema (post-push)
        run: supabase db lint --linked --level error --fail-on error

      - name: Deploy edge functions (if any)
        if: ${{ contains(github.event.head_commit.message, '[skip-functions]') == false }}
        run: |
          if [ -d "supabase/functions" ]; then
            for function_dir in supabase/functions/*/; do
              fn="${function_dir%/}"
              fn="${fn##*/}"
              case "$fn" in _*) continue ;; esac
              supabase functions deploy --no-verify-jwt "$fn" --project-ref "$SUPABASE_PROJECT_ID"
            done
          fi

      - name: Install jq (for Supabase Management API deploys)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Deploy configuration
        timeout-minutes: 10
        run: |
          echo "📝 Deploying configuration changes..."
          cd supabase
          ./scripts/deploy-config.sh $SUPABASE_PROJECT_ID
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_GOOGLE_ENABLED: ${{ vars.AUTH_GOOGLE_ENABLED || 'false' }}
          AUTH_APPLE_ENABLED: ${{ vars.AUTH_APPLE_ENABLED || 'false' }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET }}
          SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_APPLE_SECRET }}

      - name: Deploy email templates
        run: |
          echo "📧 Deploying email templates..."
          cd supabase
          chmod +x ./scripts/deploy-email-templates.sh
          ./scripts/deploy-email-templates.sh $SUPABASE_PROJECT_ID

  deploy-web:
    name: Deploy ${{ matrix.app }} to Vercel production
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admin-web
            project_id: prj_1MrhFCZC9LsYMqN3hTrjtPaOSf0e
          - app: marketing-web
            project_id: prj_Qf1yqSGW3ttj2lZvNzuxIABiLkfT
          - app: student-web
            project_id: prj_i1beD28400IZOFp0WRtzmFldEifZ
          - app: tutor-web
            project_id: prj_vGAe2xH6lLRm05mxZkFbFTXfDthi
          - app: ucat-web
            project_id: prj_xkqIaXkZGO2EvA3cIoXyl9vLeGJX
    env:
      VERCEL_ORG_ID: team_1E1lzurM2oIC9oDKmQDdk7Bz
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Deploy the gated commit
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(pnpm dlx vercel@48.9.0 deploy \
            --prod \
            --yes \
            --archive=tgz \
            --token="$VERCEL_TOKEN")"
          echo "Deployed ${{ matrix.app }}: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

  smoke-production:
    name: Smoke production web apps
    needs: deploy-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify public production boundaries
        run: node scripts/production-web-smoke.mjs
        env:
          ADMIN_PRODUCTION_BASE_URL: https://admin.altitutor.com
          MARKETING_PRODUCTION_BASE_URL: https://altitutor.com
          STUDENT_PRODUCTION_BASE_URL: https://student.altitutor.com
          TUTOR_PRODUCTION_BASE_URL: https://tutor.altitutor.com
          UCAT_PRODUCTION_BASE_URL: https://ucat.altitutor.com
