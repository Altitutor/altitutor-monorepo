appId: com.altitutor.ucat
name: Android browser handoff accepts login input
---
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 60000
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Log in"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: "Sign in"
      enabled: true
    timeout: 30000
- tapOn: "Email address"
- inputText: "${TEST_STUDENT_EMAIL}"
- assertVisible: "${TEST_STUDENT_EMAIL}"
